<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meraki Services · Equipos portuarios, automatización y energía solar</title>
<meta name="description" content="Reparación, mantenimiento, modificación y automatización de equipos portuarios, viales, autoelevadores y grúas. Energía solar. Cobertura en todo el país.">
<meta property="og:title" content="Meraki Services">
<meta property="og:description" content="Reparamos lo que no puede parar. Equipos portuarios, automatización y energía solar.">
<meta property="og:image" content="assets/hero-terminal.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0E1412">
<link rel="icon" type="image/png" href="assets/logo-meraki.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #0E1412; color: #0E1412; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, h4 { margin: 0; font-family: "Inter Tight", Inter, system-ui, sans-serif; font-weight: 600; letter-spacing: -0.035em; line-height: 1.02; }
  p { margin: 0; text-wrap: pretty; }
  ul { margin: 0; padding: 0; list-style: none; }
  button { font: inherit; cursor: pointer; color: inherit; }
  img { display: block; }

  .wrap { max-width: 1360px; margin: 0 auto; padding: 0 32px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; }
  .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .hl { color: #C8F169; }
  .hl-dark { color: #22453D; }

  /* NAV */
  .nav { position: fixed; top: 14px; left: 0; right: 0; z-index: 60; padding: 0 16px; animation: fadeDown .8s cubic-bezier(.16,.84,.3,1) both; }
  .nav-in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.86); backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5); border: 1px solid rgba(14,20,18,0.08); border-radius: 999px; padding: 8px 8px 8px 22px; box-shadow: 0 18px 50px -28px rgba(0,0,0,0.55); }
  .nav-logo { height: 22px; width: auto; }
  .nav-logo-btn { background: none; border: 0; padding: 6px 0; }
  .nav-links { display: flex; gap: 2px; margin-left: auto; align-items: center; }
  .nav-link { background: none; border: 0; padding: 10px 14px; border-radius: 999px; font-size: 14.5px; font-weight: 500; color: #3A4441; transition: background .25s, color .25s; }
  .nav-link:hover { background: rgba(14,20,18,0.06); color: #0E1412; }
  .nav-cta { margin-left: 6px; }
  @media (max-width: 860px) { .nav-links { display: none; } .nav-cta { margin-left: auto; } }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; gap: 12px; border-radius: 999px; padding: 8px 8px 8px 22px; font-weight: 600; font-size: 15px; border: 0; transition: transform .35s cubic-bezier(.16,.84,.3,1), background .3s, color .3s, border-color .3s; white-space: nowrap; }
  .btn:hover { transform: translateY(-2px); }
  .btn .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; transition: transform .35s cubic-bezier(.16,.84,.3,1); }
  .btn:hover .ic { transform: rotate(-45deg); }
  .btn-lime { background: #C8F169; color: #0E1412; }
  .btn-lime .ic { background: #0E1412; color: #C8F169; }
  .btn-lime:hover { background: #D8FA8E; color: #0E1412; }
  .btn-dark { background: #0E1412; color: #FFFFFF; }
  .btn-dark .ic { background: #C8F169; color: #0E1412; }
  .btn-dark:hover { color: #FFFFFF; background: #22453D; }
  .btn-ghost { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.22); color: #FFFFFF; padding: 15px 22px; }
  .btn-ghost:hover { background: rgba(255,255,255,0.12); color: #FFFFFF; }

  /* HERO */
  .hero { position: relative; background: #0E1412; color: #FFFFFF; overflow: hidden; padding: 150px 0 90px; }
  .hero-grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px); background-size: 64px 64px; -webkit-mask-image: radial-gradient(ellipse 70% 60% at 30% 40%, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse 70% 60% at 30% 40%, #000 30%, transparent 75%); pointer-events: none; }
  .hero-glow { position: absolute; width: 900px; height: 900px; left: -260px; top: -320px; background: radial-gradient(circle, rgba(34,69,61,0.9) 0%, rgba(34,69,61,0) 62%); pointer-events: none; }
  .hero-glow-2 { position: absolute; width: 600px; height: 600px; right: -120px; bottom: -280px; background: radial-gradient(circle, rgba(200,241,105,0.16) 0%, rgba(200,241,105,0) 60%); pointer-events: none; }
  .hero-layout { position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 56px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px 9px 12px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: rgba(255,255,255,0.86); }
  .chip-dot { width: 8px; height: 8px; border-radius: 50%; background: #C8F169; box-shadow: 0 0 0 0 rgba(200,241,105,0.6); animation: pulse 2.2s infinite; }
  .hero h1 { font-size: clamp(48px, 7vw, 108px); margin-top: 28px; letter-spacing: -0.045em; }
  .hero-lead { margin-top: 28px; font-size: clamp(17px, 1.5vw, 20px); line-height: 1.6; color: rgba(255,255,255,0.72); max-width: 54ch; }
  .hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 40px; }
  .hero-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-top: 56px; border-top: 1px solid rgba(255,255,255,0.14); }
  .hero-meta > div { padding: 20px 18px 0 0; }
  .hero-meta .num { font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: clamp(30px, 3vw, 42px); letter-spacing: -0.03em; color: #FFFFFF; }
  .hero-meta .lbl { margin-top: 6px; font-size: 13.5px; line-height: 1.45; color: rgba(255,255,255,0.62); }
  .hero-visual { position: relative; min-height: 560px; }
  .hero-img { position: absolute; inset: 0; border-radius: 32px; overflow: hidden; background: #1B2421; }
  .hero-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 60%; }
  .hero-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(14,20,18,0.55), rgba(14,20,18,0) 45%); }
  .glass { background: rgba(14,20,18,0.55); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border: 1px solid rgba(255,255,255,0.16); border-radius: 22px; color: #FFFFFF; }
  .float-1 { position: absolute; left: -28px; bottom: 40px; padding: 18px 20px; display: flex; align-items: center; gap: 14px; max-width: 300px; animation: floatY 6s ease-in-out infinite; }
  .float-1 .ico { width: 44px; height: 44px; border-radius: 14px; background: #C8F169; color: #0E1412; display: grid; place-items: center; font-size: 20px; flex: 0 0 auto; }
  .float-2 { position: absolute; right: 22px; top: 22px; padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; animation: floatY 7s ease-in-out -2s infinite; }
  .tag { padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.1); font-size: 13px; font-weight: 500; }
  @media (max-width: 700px) { .hero { padding-top: 120px; } .hero-visual { min-height: 400px; } .float-1 { left: 14px; bottom: 14px; } .hero-meta { grid-template-columns: 1fr; } .hero-meta > div { padding: 16px 0 0; } }

  /* MARQUEE */
  .marq { background: #C8F169; overflow: hidden; padding: 18px 0; }
  .marq-track { display: flex; width: max-content; animation: marq 38s linear infinite; }
  .marq-item { display: flex; align-items: center; gap: 28px; padding-right: 28px; font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.02em; color: #0E1412; white-space: nowrap; }
  .marq-star { font-size: 18px; color: #22453D; }

  /* SECTIONS */
  .sec { padding: 120px 0; }
  .sec-light { background: #F3F4F1; }
  .sec-white { background: #FFFFFF; }
  .sec-dark { background: #0E1412; color: #FFFFFF; }
  .sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; flex-wrap: wrap; }
  .sec-title { font-size: clamp(36px, 4.6vw, 64px); margin-top: 18px; max-width: 18ch; }
  .sec-sub { font-size: 17px; line-height: 1.65; max-width: 40ch; }
  @media (max-width: 700px) { .sec { padding: 84px 0; } .wrap { padding: 0 18px; } }

  /* UNITS */
  .units { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 18px; margin-top: 56px; }
  .unit { position: relative; text-align: left; border: 0; padding: 0; height: 580px; border-radius: 28px; overflow: hidden; background: #1B2421; color: #FFFFFF; display: block; isolation: isolate; }
  .unit img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(.16,.84,.3,1); z-index: -2; }
  .unit::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgba(14,20,18,0.96) 0%, rgba(14,20,18,0.7) 38%, rgba(14,20,18,0.05) 75%); transition: background .5s; }
  .unit:hover img { transform: scale(1.07); }
  .unit-top { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; }
  .unit-num { padding: 8px 14px; border-radius: 999px; background: rgba(14,20,18,0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.18); }
  .unit-arrow { width: 52px; height: 52px; border-radius: 50%; background: #FFFFFF; color: #0E1412; display: grid; place-items: center; font-size: 20px; transition: transform .5s cubic-bezier(.16,.84,.3,1), background .3s; }
  .unit:hover .unit-arrow { transform: rotate(-45deg); background: #C8F169; }
  .unit-body { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 28px 30px; }
  .unit-body h3 { font-size: clamp(32px, 3vw, 42px); }
  .unit-tag { margin-top: 10px; font-size: 15.5px; line-height: 1.5; color: rgba(255,255,255,0.75); }
  .unit-more { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .55s cubic-bezier(.16,.84,.3,1), opacity .4s; }
  .unit-more > ul { overflow: hidden; }
  .unit:hover .unit-more, .unit:focus-visible .unit-more { grid-template-rows: 1fr; opacity: 1; }
  .unit-more li { display: flex; gap: 10px; align-items: center; font-size: 14.5px; color: rgba(255,255,255,0.86); padding-top: 10px; }
  .unit-more li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #C8F169; flex: 0 0 auto; }
  .unit-more ul { padding-top: 10px; }
  @media (hover: none) { .unit-more { grid-template-rows: 1fr; opacity: 1; } }

  /* ABOUT */
  .about { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 64px 88px; align-items: center; }
  .about p.body { font-size: 18px; line-height: 1.7; color: #4A5350; max-width: 56ch; margin-top: 22px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 44px; }
  .stat { background: #F3F4F1; border-radius: 20px; padding: 22px 20px; }
  .stat .num { font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: clamp(34px, 3.4vw, 48px); letter-spacing: -0.04em; color: #22453D; line-height: 1; }
  .stat .lbl { margin-top: 10px; font-size: 13.5px; line-height: 1.45; color: #4F5956; }
  @media (max-width: 560px) { .stats { grid-template-columns: 1fr; } }
  .collage { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 250px 250px; gap: 14px; }
  .collage > div { position: relative; border-radius: 24px; overflow: hidden; background: #1B2421; }
  .collage > div:first-child { grid-row: 1 / 3; }
  .collage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.1s cubic-bezier(.16,.84,.3,1); }
  .collage > div:hover img { transform: scale(1.06); }
  .collage .badge { position: absolute; left: 14px; bottom: 14px; padding: 10px 14px; border-radius: 14px; }

  /* SERVICES */
  .svc { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 40px 64px; margin-top: 64px; align-items: start; }
  .svc-list { border-top: 1px solid rgba(255,255,255,0.12); }
  .svc-row { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid rgba(255,255,255,0.12); padding: 26px 8px; display: flex; align-items: center; gap: 22px; color: rgba(255,255,255,0.62); transition: color .3s, padding .4s cubic-bezier(.16,.84,.3,1); }
  .svc-row:hover { color: #FFFFFF; }
  .svc-row .t { font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: clamp(22px, 2.2vw, 30px); letter-spacing: -0.03em; }
  .svc-row .go { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); display: grid; place-items: center; transition: all .35s; flex: 0 0 auto; }
  .svc-row.is-active { color: #FFFFFF; padding-left: 20px; }
  .svc-row.is-active .go { background: #C8F169; color: #0E1412; border-color: #C8F169; transform: rotate(-45deg); }
  .svc-row.is-active .n { color: #C8F169; }
  .svc-card { position: sticky; top: 110px; border-radius: 28px; overflow: hidden; background: #1B2421; border: 1px solid rgba(255,255,255,0.1); }
  .svc-card .img { position: relative; height: 340px; overflow: hidden; }
  .svc-card .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: imgIn .7s cubic-bezier(.16,.84,.3,1) both; }
  .svc-card .txt { padding: 28px 30px 32px; }
  .svc-card h3 { font-size: 30px; }
  .svc-card p { margin-top: 12px; font-size: 16.5px; line-height: 1.65; color: rgba(255,255,255,0.72); }

  /* PROCESS */
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 16px; margin-top: 64px; }
  .step { position: relative; background: #FFFFFF; border: 1px solid #E3E5E0; border-radius: 24px; padding: 28px 26px 30px; transition: transform .45s cubic-bezier(.16,.84,.3,1), box-shadow .45s, border-color .45s; }
  .step:hover { transform: translateY(-6px); box-shadow: 0 30px 60px -36px rgba(14,20,18,0.45); border-color: #22453D; }
  .step .big { font-family: "Inter Tight", sans-serif; font-weight: 700; font-size: 84px; letter-spacing: -0.06em; line-height: 0.9; color: transparent; -webkit-text-stroke: 1.5px #22453D; }
  .step h4 { font-size: 26px; margin-top: 26px; }
  .step p { margin-top: 10px; font-size: 15.5px; line-height: 1.62; color: #4F5956; }
  .step .bar { height: 4px; border-radius: 4px; background: #E3E5E0; margin-top: 28px; overflow: hidden; }
  .step .bar span { display: block; height: 100%; background: #22453D; border-radius: 4px; width: 0; transition: width 1.2s cubic-bezier(.16,.84,.3,1) .3s; }
  .step.is-in .bar .w25 { width: 25%; } .step.is-in .bar .w50 { width: 50%; } .step.is-in .bar .w75 { width: 75%; } .step.is-in .bar .w100 { width: 100%; }

  /* GALLERY */
  .bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 230px; gap: 14px; margin-top: 56px; }
  .g-item { position: relative; border-radius: 22px; overflow: hidden; background: #1B2421; }
  .g-item img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.1s cubic-bezier(.16,.84,.3,1); }
  .g-item:hover img { transform: scale(1.06); }
  .g-item .cap { position: absolute; left: 12px; bottom: 12px; right: 12px; padding: 10px 14px; border-radius: 14px; font-size: 13.5px; font-weight: 500; opacity: 0; transform: translateY(8px); transition: all .4s cubic-bezier(.16,.84,.3,1); }
  .g-item:hover .cap { opacity: 1; transform: none; }
  .g-wide { grid-column: span 2; }
  .g-tall { grid-row: span 2; }
  @media (max-width: 900px) { .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 200px; } }
  @media (max-width: 520px) { .bento { grid-template-columns: 1fr; } .g-wide { grid-column: auto; } .g-tall { grid-row: auto; } .g-item .cap { opacity: 1; transform: none; } }

  /* CONTACT */
  .contact { position: relative; border-radius: 36px; overflow: hidden; background: linear-gradient(135deg, #22453D 0%, #183129 100%); color: #FFFFFF; padding: clamp(36px, 5vw, 72px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 48px 72px; isolation: isolate; }
  .contact::before { content: ""; position: absolute; right: -180px; top: -180px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(200,241,105,0.25), rgba(200,241,105,0) 65%); z-index: -1; }
  .contact h2 { font-size: clamp(38px, 4.6vw, 64px); margin-top: 18px; max-width: 14ch; }
  .c-row { display: flex; gap: 16px; align-items: baseline; padding: 16px 0; border-top: 1px solid rgba(255,255,255,0.18); font-size: 16.5px; }
  .c-row:last-child { border-bottom: 1px solid rgba(255,255,255,0.18); }
  .c-row .k { min-width: 96px; color: rgba(255,255,255,0.66); }
  .att li { display: flex; gap: 12px; align-items: center; font-size: 16.5px; line-height: 1.5; color: rgba(255,255,255,0.88); padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.14); }
  .att li::before { content: "✓"; width: 24px; height: 24px; border-radius: 50%; background: rgba(200,241,105,0.18); color: #C8F169; display: grid; place-items: center; font-size: 12px; flex: 0 0 auto; }
  .soc { display: inline-flex; padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.28); font-size: 14px; font-weight: 500; color: #FFFFFF; transition: all .3s; }
  .soc:hover { background: #FFFFFF; color: #22453D; border-color: #FFFFFF; }

  /* FOOTER */
  .foot { background: #0E1412; color: rgba(255,255,255,0.62); padding: 72px 0 32px; overflow: hidden; }
  .foot-word { font-family: "Inter Tight", sans-serif; font-weight: 700; font-size: clamp(80px, 19vw, 300px); letter-spacing: -0.07em; line-height: 0.8; background: linear-gradient(to bottom, rgba(255,255,255,0.16), rgba(255,255,255,0)); -webkit-background-clip: text; background-clip: text; color: transparent; margin-top: 56px; user-select: none; }
  .foot a:hover { color: #FFFFFF; }

  /* DEPARTMENT PAGE */
  .dep-hero { background: #0E1412; padding: 110px 0 0; }
  .dep-banner { position: relative; height: min(64vh, 560px); min-height: 380px; border-radius: 32px; overflow: hidden; background: #1B2421; color: #FFFFFF; }
  .dep-banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .dep-banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(14,20,18,0.92) 0%, rgba(14,20,18,0.5) 45%, rgba(14,20,18,0.05) 80%); }
  .dep-banner .in { position: absolute; left: 0; right: 0; bottom: 0; padding: clamp(24px, 4vw, 48px); z-index: 1; }
  .dep-banner h1 { font-size: clamp(44px, 6vw, 92px); margin-top: 18px; max-width: 16ch; letter-spacing: -0.045em; }
  .back { background: none; border: 0; padding: 22px 0; color: rgba(255,255,255,0.66); font-size: 15px; font-weight: 500; display: inline-flex; gap: 10px; align-items: center; }
  .back:hover { color: #FFFFFF; }
  .dsvc { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; margin-top: 48px; }
  .dsvc > div { background: #FFFFFF; border: 1px solid #E3E5E0; border-radius: 22px; padding: 26px 24px 28px; transition: transform .45s cubic-bezier(.16,.84,.3,1), border-color .45s, box-shadow .45s; }
  .dsvc > div:hover { transform: translateY(-5px); border-color: #22453D; box-shadow: 0 30px 60px -38px rgba(14,20,18,0.45); }
  .dsvc .dot { width: 40px; height: 40px; border-radius: 12px; background: #22453D; color: #C8F169; display: grid; place-items: center; font-size: 13px; }
  .dsvc h4 { font-size: 22px; margin-top: 20px; }
  .dsvc p { margin-top: 10px; font-size: 15px; line-height: 1.6; color: #4F5956; }
  .scope li { display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid #E3E5E0; font-size: 16.5px; line-height: 1.6; color: #3A4441; }
  .scope li .n { color: #22453D; min-width: 28px; }
  .imgs3 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

  '<div class="imgs3" data-reveal data-delay="160"><div><img src="' + cur.img3 + '" alt="" loading="lazy"></div><div><img src="' + cur.img4 + '" alt="" loading="lazy"></div><div><img src="' + cur.img5 + '" alt="" loading="lazy"></div></div></div></section>' +

  '<section class="sec sec-light" style="padding:80px 0"><div class="wrap"><span class="mono eyebrow hl-dark">Otras unidades</span><div class="other">' +
  map(DEPS, function (d) { return '<button data-go="' + d.key + '"><span class="mono" style="color:#22453D">Unidad ' + d.num + '</span><span class="nm">' + esc(d.name) + '</span><span style="font-size:15px;line-height:1.55;color:#4F5956">' + esc(d.short) + '</span></button>'; }) +
  '</div></div></section></main>';
}

function contact() {
  return '<section id="contacto" class="sec sec-dark"><div class="wrap"><div class="contact"><div>' +
    '<span class="mono eyebrow" data-reveal style="color:#C8F169">Contacto</span><h2 data-reveal data-delay="100">Coordinemos una visita técnica.</h2>' +
    '<p data-reveal data-delay="180" style="margin-top:20px;font-size:17.5px;line-height:1.65;color:rgba(255,255,255,0.8);max-width:44ch">Consultas técnicas, licitaciones y emergencias operativas: responde un especialista de la unidad correspondiente.</p>' +
    '<div data-reveal data-delay="240" style="display:flex;flex-wrap:wrap;gap:12px;margin-top:34px"><a class="btn btn-lime" href="' + waHref() + '"' + ext + '>Escribir por WhatsApp <span class="ic" aria-hidden="true">→</span></a><a class="btn btn-ghost" href="mailto:' + CONFIG.correo + '">Enviar correo</a></div>' +
    '<div style="margin-top:40px">' +
      '<div class="c-row"><span class="k mono">Correo</span><a href="mailto:' + CONFIG.correo + '">' + esc(CONFIG.correo) + '</a></div>' +
      '<div class="c-row"><span class="k mono">Teléfono</span><a href="tel:' + CONFIG.telefono.replace(/[^\d+]/g, "") + '">' + esc(CONFIG.telefono) + '</a></div>' +
      '<div class="c-row"><span class="k mono">Sede</span><span>' + esc(CONFIG.sede) + '</span></div>' +
    '</div></div>' +
    '<div style="display:flex;flex-direction:column;gap:36px;justify-content:space-between"><div><span class="mono" style="color:rgba(255,255,255,0.7)">Atendemos</span><ul class="att" style="margin-top:14px">' + map(ATENDEMOS, function (a) { return '<li>' + esc(a) + '</li>'; }) + '</ul></div>' +
    '<div><span class="mono" style="color:rgba(255,255,255,0.7)">Seguinos</span><div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:14px">' + map(CONFIG.social, function (s) { return '<a class="soc" href="' + s.href + '"' + ext + '>' + esc(s.label) + '</a>'; }) + '</div></div></div>' +
  '</div></div></section>';
}

function footer() {
  return '<footer class="foot"><div class="wrap"><div style="display:flex;justify-content:space-between;gap:28px;flex-wrap:wrap;align-items:center">' +
    '<img src="assets/logo-meraki.png" alt="Meraki Services" style="height:24px;width:auto;filter:brightness(0) invert(1);opacity:0.9">' +
    '<span style="display:flex;flex-wrap:wrap;gap:22px;font-size:14px">' + map(CONFIG.social, function (s) { return '<a href="' + s.href + '"' + ext + '>' + esc(s.label) + '</a>'; }) + '</span></div>' +
    '<div class="foot-word" aria-hidden="true">Meraki</div>' +
    '<div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:24px;font-size:13.5px"><span>© ' + new Date().getFullYear() + ' Meraki Port &amp; Industrial Services S.A.</span><span>Equipos portuarios · Automatización · Energía solar</span></div>' +
  '</div></footer>';
}

function render() {
  var cur = DEPS.filter(function (d) { return d.key === state.page; })[0];
  document.getElementById("app").innerHTML =
    '<div style="min-height:100vh;display:flex;flex-direction:column;background:#0E1412">' + nav() + (cur ? depPage(cur) : home()) + contact() + footer() + '</div>';
  document.title = cur ? cur.name + " · Meraki Services" : "Meraki Services · Equipos portuarios, automatización y energía solar";
  observe();
}

/* Navegación entre unidades con dirección propia (?unidad=port) */
function go(page, push) {
  state.page = page;
  if (push !== false) {
    var url = page === "home" ? location.pathname : location.pathname + "?unidad=" + page;
    history.pushState({ page: page }, "", url);
  }
  render();
  window.scrollTo(0, 0);
}
window.addEventListener("popstate", function () { readUrl(); render(); });
function readUrl() {
  var u = new URLSearchParams(location.search).get("unidad");
  state.page = DEPS.some(function (d) { return d.key === u; }) ? u : "home";
}

function pickSvc(i) {
  if (i === state.svc) return;
  state.svc = i;
  document.querySelectorAll(".svc-row").forEach(function (b, j) { b.classList.toggle("is-active", j === i); });
  var card = document.getElementById("svc-card");
  if (card) card.innerHTML = svcCard(SERVICIOS[i]);
}

document.addEventListener("click", function (e) {
  var g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.getAttribute("data-go")); return; }
  var s = e.target.closest("[data-svc]");
  if (s) { pickSvc(+s.getAttribute("data-svc")); return; }
  var a = e.target.closest('a[href^="#"]');
  if (a) {
    var id = a.getAttribute("href").slice(1);
    var el = document.getElementById(id);
    if (!el && state.page !== "home") { go("home"); el = document.getElementById(id); }
    if (el) { e.preventDefault(); el.scrollIntoView({ behavior: "smooth" }); }
  }
});
document.addEventListener("mouseover", function (e) { var s = e.target.closest("[data-svc]"); if (s) pickSvc(+s.getAttribute("data-svc")); });
document.addEventListener("focusin", function (e) { var s = e.target.closest("[data-svc]"); if (s) pickSvc(+s.getAttribute("data-svc")); });

/* Animaciones al hacer scroll */
var io = "IntersectionObserver" in window ? new IntersectionObserver(function (entries) {
  entries.forEach(function (en) {
    if (!en.isIntersecting) return;
    var el = en.target; io.unobserve(el);
    var delay = parseInt(el.getAttribute("data-delay") || "0", 10);
    setTimeout(function () { el.classList.add("is-in"); }, delay);
    el.querySelectorAll("[data-count]").forEach(countUp);
  });
}, { rootMargin: "0px 0px -6% 0px" }) : null;

function observe() {
  document.querySelectorAll("[data-reveal]").forEach(function (el) {
    if (io) io.observe(el); else { el.classList.add("is-in"); el.querySelectorAll("[data-count]").forEach(countUp); }
  });
}

function countUp(el) {
  if (el.dataset.counted) return;
  el.dataset.counted = "1";
  var to = parseFloat(el.dataset.count), suffix = el.dataset.suffix || "";
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = to + suffix; return; }
  var t0 = performance.now(), dur = 1300;
  (function tick(now) {
    var p = Math.min(1, (now - t0) / dur), k = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * k) + suffix;
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}

readUrl();
render();
</script>
</body>
</html>
